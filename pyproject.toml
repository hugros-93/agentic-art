[project]
name = "agentic-art"
version = "0.1.0"
description = "Agentic art creation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Hugo De Oliveira" },
]
dependencies = [
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "mcp>=1.0,<2.0",
    "ollama>=0.6,<1.0",
    "pydantic>=2.0,<3.0",
    "opentelemetry-api>=1.0,<2.0",
    "opentelemetry-sdk>=1.0,<2.0",
    "langchain-ollama>=1.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "cairosvg>=2.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.12,<1.0",
    "pyright>=1.1,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/painting_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring external services",
]
